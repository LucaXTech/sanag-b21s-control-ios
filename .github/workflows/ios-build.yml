name: iOS build (unsigned)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Validate plist and project
        run: |
          plutil -lint SanagControl/Info.plist
          plutil -lint SanagControl.xcodeproj/project.pbxproj
      - name: Build without code signing
        run: |
          xcodebuild -project SanagControl.xcodeproj \
            -scheme SanagControl -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SanagDerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned SideStore IPA (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SanagDerivedData/Build/Products/Debug-iphoneos/SanagControl.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          test "$VERSION" = "0.5.0"
          test "$BUNDLE_ID" = "com.lucaxtech.sanagcontrol"
          mkdir -p "$RUNNER_TEMP/SanagPackage/Payload"
          ditto "$APP" "$RUNNER_TEMP/SanagPackage/Payload/SanagControl.app"
          cd "$RUNNER_TEMP/SanagPackage"
          zip -qry "$RUNNER_TEMP/SanagControl-0.5.0-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/SanagControl-0.5.0-unsigned.ipa"
      - name: Test local endpoint injection using example.invalid
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 scripts/configure-ipa.py \
            --input "$RUNNER_TEMP/SanagControl-0.5.0-unsigned.ipa" \
            --output "$RUNNER_TEMP/SanagControl-0.5.0-test-only.ipa" \
            --endpoint "https://example.invalid/v1/report"
          python3 - "$RUNNER_TEMP/SanagControl-0.5.0-test-only.ipa" <<'PY'
          import plistlib, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as ipa:
              info = plistlib.loads(ipa.read("Payload/SanagControl.app/Info.plist"))
              assert info["DeviceReportURL"] == "https://example.invalid/v1/report"
          PY
      - name: Upload unsigned SideStore IPA (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SanagControl-0.5.0-unsigned
          path: ${{ runner.temp }}/SanagControl-0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
